<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Withdraw - BobBank</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
  <style>
    body { background-color: #f0f4f8; }
    .bank-logo { font-weight: 700; color: #93c5fd; font-size: 1.25rem; }
    .form-card { max-width: 480px; margin: 60px auto; }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand bank-logo" href="/dashboard">BobBank</a>
      <form action="/logout" method="POST" class="m-0">
        <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
      </form>
    </div>
  </nav>

  <div class="container">
    <div class="form-card card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5">

        <h4 class="mb-1 fw-bold text-warning">Withdraw Funds</h4>
        <p class="text-muted mb-4">Withdraw money from your account.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/withdraw" method="POST" novalidate>
          <div class="mb-4">
            <label for="amount" class="form-label fw-semibold">Amount (USD)</label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input type="number" class="form-control form-control-lg"
                     id="amount" name="amount" placeholder="0.00"
                     min="0.01" step="0.01" required />
            </div>
            <div class="form-text">Enter a positive amount to withdraw.</div>
          </div>
          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-warning btn-lg">Confirm Withdrawal</button>
          </div>
        </form>

        <div class="text-center">
          <a href="/dashboard" class="text-muted text-decoration-none small">Back to Dashboard</a>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmO7gfbtRaUNjVtdFk4I3FzKZHMR"
          crossorigin="anonymous"></script>
</body>
</html>
