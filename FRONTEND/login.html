<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - BobBank</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
  <style>
    body { background-color: #f0f4f8; }
    .login-card { max-width: 420px; margin: 80px auto; }
    .bank-logo { font-size: 1.6rem; font-weight: 700; color: #1a56db; letter-spacing: -0.5px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-card card shadow-sm border-0">
      <div class="card-body p-4 p-md-5">

        <div class="text-center mb-4">
          <div class="bank-logo">BobBank</div>
          <p class="text-muted mt-1 mb-0">Secure Online Banking</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST" novalidate>
          <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Username</label>
            <input type="text" class="form-control" id="username" name="username"
                   placeholder="Enter your username" autocomplete="username" required />
          </div>
          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Enter your password" autocomplete="current-password" required />
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">Login</button>
          </div>
        </form>

        <p class="text-center text-muted mt-4 mb-0" style="font-size:0.85rem;">
          Demo credentials: <code>demo</code> / <code>password123</code>
        </p>

      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmO7gfbtRaUNjVtdFk4I3FzKZHMR"
          crossorigin="anonymous"></script>
</body>
</html>
